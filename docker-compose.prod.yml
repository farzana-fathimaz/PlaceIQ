version: '3.9'

services:

  mongo:
    image: mongo:7
    container_name: placeiq_mongo
    restart: always
    volumes:
      - mongo-data:/data/db
    networks:
      - placeiq-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: placeiq_backend
    restart: always
    env_file:
      - ./backend/.env.prod
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - placeiq-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: placeiq_frontend
    restart: always
    networks:
      - placeiq-net

  nginx:
    image: nginx:alpine
    container_name: placeiq_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - placeiq-net

volumes:
  mongo-data:
    driver: local

networks:
  placeiq-net:
    driver: bridge