version: '3.9'

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: placeiq_backend
    restart: always
    env_file:
      - ./backend/.env.prod
    expose:
      - "5000"
    networks:
      - placeiq-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: placeiq_frontend
    restart: always
    expose:
      - "80"
    networks:
      - placeiq-net
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: placeiq_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - placeiq-net

networks:
  placeiq-net:
    driver: bridge