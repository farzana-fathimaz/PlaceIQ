version: '3.9'

services:

  mongo:
    image: mongo:7
    container_name: placeiq_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - placeiq-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placeiq_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - placeiq-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placeiq_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - placeiq-net

  nginx:
    image: nginx:alpine
    container_name: placeiq_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - placeiq-net

volumes:
  mongo-data:

networks:
  placeiq-net:
    driver: bridge