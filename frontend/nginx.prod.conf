server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://placeiq-production-7f0b.up.railway.app/;
    }

    location /uploads/ {
        proxy_pass https://placeiq-production-7f0b.up.railway.app/uploads/;
    }
}